name: Build & Send Debug APK

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug 2>&1 | tee build.log

      - name: Send Debug APK to Telegram
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TOKEN_BOT }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          CAPTION=$'<b>🛠️ DEBUG BUILD SUCCESS</b>\n\n<b>Repo:</b> '"${GITHUB_REPOSITORY}"$'\n<b>Branch:</b> <code>'"${GITHUB_REF_NAME}"$'</code>\n<b>Commit:</b> <code>'"${GITHUB_SHA::7}"$'</code>\n<b>Author:</b> '"${GITHUB_ACTOR}"
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F chat_id="${CHAT_ID}" \
            -F document=@app/build/outputs/apk/debug/app-debug.apk \
            -F caption="${CAPTION}" \
            -F parse_mode="HTML"

      - name: Send Failure Log to Telegram
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TOKEN_BOT }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          CAPTION=$'❌ <b>BUILD FAILED!</b>\n\n<b>Repo:</b> '"${GITHUB_REPOSITORY}"$'\n<b>Branch:</b> <code>'"${GITHUB_REF_NAME}"$'</code>\n<b>Commit:</b> <code>'"${GITHUB_SHA::7}"$'</code>\n<b>Author:</b> '"${GITHUB_ACTOR}"
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F chat_id="${CHAT_ID}" \
            -F document=@build.log \
            -F caption="${CAPTION}" \
            -F parse_mode="HTML"